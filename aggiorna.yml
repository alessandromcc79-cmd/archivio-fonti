name: Aggiorna archivio

on:
  schedule:
    - cron: "17 */3 * * *"   # ogni 3 ore
  workflow_dispatch:          # pulsante "Run workflow" per lanciarlo a mano

permissions:
  contents: write

concurrency:
  group: aggiorna
  cancel-in-progress: false

jobs:
  raccogli:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python raccogli.py
      - name: Salva le novità
        run: |
          git config user.name "archivio-bot"
          git config user.email "archivio-bot@users.noreply.github.com"
          git add docs/data.json docs/stato.json
          git diff --cached --quiet || git commit -m "Aggiornamento archivio $(date -u +'%Y-%m-%d %H:%M')"
          git push
