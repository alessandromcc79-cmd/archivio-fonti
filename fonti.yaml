# ─────────────────────────────────────────────────────────────
#  LE TUE FONTI
#  Per aggiungere una fonte copia un blocco e cambia i valori.
#
#  tipo: rss     → il sito ha un feed (indica "url" del feed)
#  tipo: pagina  → il sito NON ha un feed: leggo la pagina dei
#                  comunicati e prendo i link nuovi. "filtro" è
#                  un pezzo di indirizzo che hanno tutte le notizie
#                  (se non lo sai, lascialo vuoto: provo a capirlo da solo)
#  tipo: google  → passo da Google News con una ricerca ("cerca")
#                  utile per i siti che caricano le notizie in modo
#                  dinamico o che non vogliono essere letti da programmi
#
#  testo: si     → salvo anche il testo completo (solo fonti
#                  istituzionali, partiti, società: per i giornali
#                  tengo solo titolo, sommario e link)
# ─────────────────────────────────────────────────────────────

